<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password - Xyz</title>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <!-- Google Fonts for Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../src/icon.png" type="image/png">
  <!-- Link to your style.css -->
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: var(--background-color);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
    }
    .reset-container {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 100%;
      transform: perspective(1000px) translateZ(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      z-index: 10;
    }
    .reset-container:hover {
      transform: perspective(1000px) translateZ(8px);
      box-shadow: 0 12px 30px var(--shadow-color);
    }
    .reset-container h2 {
      color: var(--text-color);
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .reset-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background: var(--primary-color);
      color: var(--text-color);
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 12px var(--shadow-color);
      transform: perspective(1000px) translateZ(0);
      transition: all 0.3s ease;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .reset-btn:hover {
      background: var(--primary-dark);
      transform: perspective(1000px) translateZ(8px);
      box-shadow: 0 6px 15px var(--shadow-color);
    }
    .reset-btn i {
      font-size: 1.2rem;
    }
    .toggle-link {
      color: var(--muted-color);
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: underline;
      margin: 0.5rem 0;
      display: inline-block;
      transition: color 0.3s ease;
    }
    .toggle-link:hover {
      color: var(--primary-color);
    }
    .form-control {
      background: var(--secondary-color);
      color: var(--text-color);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0.6rem;
      font-size: 0.9rem;
      width: 100%;
      margin-bottom: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 8px var(--shadow-color);
      outline: none;
    }
    .error-message, .success-message {
      font-size: 0.85rem;
      margin: 0.5rem 0;
      display: none;
      text-align: left;
    }
    .error-message {
      color: var(--accent-color);
    }
    .success-message {
      color: #4CAF50;
    }
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: var(--background-color);
    }
    .background-effect {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, var(--primary-color), var(--accent-color), var(--secondary-color));
      opacity: 0.1;
      z-index: -2;
      animation: gradient 15s ease infinite;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--background-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .spinner {
      border: 4px solid var(--muted-color);
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Background Gradient Effect -->
  <div class="background-effect"></div>
  <!-- Particle Container -->
  <div id="particles-js"></div>
  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>
  <!-- Reset Password Container -->
  <div class="reset-container">
    <h2>Reset Password</h2>
    <form id="resetForm">
      <input type="email" class="form-control" id="resetEmailInput" placeholder="Email" required>
      <p class="error-message" id="resetErrorMessage"></p>
      <p class="success-message" id="resetSuccessMessage"></p>
      <button type="submit" class="reset-btn" id="resetBtn">
        <i class="fas fa-envelope"></i> Send Reset Email
      </button>
      <a href="login.html" class="toggle-link">Back to Login</a>
    </form>
  </div>

  <!-- Particles.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyCiv11-1PLlpzrz1Yhye_f25EDGKGI19mM",
      authDomain: "xyz-login-page.firebaseapp.com",
      projectId: "xyz-login-page",
      storageBucket: "xyz-login-page.appspot.com",
      messagingSenderId: "949338499882",
      appId: "1:949338499882:web:95b5ec569c745d3c358c53",
      measurementId: "G-G99FQDK8N7"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // DOM Elements
    const resetForm = document.getElementById("resetForm");
    const resetEmailInput = document.getElementById("resetEmailInput");
    const resetErrorMessage = document.getElementById("resetErrorMessage");
    const resetSuccessMessage = document.getElementById("resetSuccessMessage");
    const loadingOverlay = document.getElementById("loadingOverlay");

    // Password Reset
    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = resetEmailInput.value.trim();

      if (!validateEmail(email)) {
        resetErrorMessage.style.display = "block";
        resetErrorMessage.textContent = "Invalid email format.";
        return;
      }

      loadingOverlay.classList.add("active");
      resetMessages();

      try {
        await sendPasswordResetEmail(auth, email);
        loadingOverlay.classList.remove("active");
        resetSuccessMessage.style.display = "block";
        resetSuccessMessage.textContent = "Password reset email sent. Check your inbox.";
        resetForm.reset();
      } catch (error) {
        loadingOverlay.classList.remove("active");
        resetErrorMessage.style.display = "block";
        resetErrorMessage.textContent = getFriendlyErrorMessage(error.code);
        console.error("Password Reset error:", error);
      }
    });

    // Email validation
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    // Friendly error messages
    function getFriendlyErrorMessage(errorCode) {
      switch (errorCode) {
        case "auth/invalid-email": return "Invalid email format.";
        case "auth/user-not-found": return "No user found with this email.";
        case "auth/too-many-requests": return "Too many attempts. Please try again later.";
        case "auth/network-request-failed": return "Network error. Please check your connection.";
        default: return `An error occurred: ${errorCode}. Please try again.`;
      }
    }

    // Reset messages
    function resetMessages() {
      [resetErrorMessage, resetSuccessMessage].forEach(msg => {
        msg.style.display = "none";
        msg.textContent = "";
      });
    }

    // Particles.js Configuration
    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: ["#6C63FF", "#FF6B6B", "#FFFFFF"] },
        shape: { type: "circle", stroke: { width: 0, color: "#000000" } },
        opacity: { value: 0.7, random: true, anim: { enable: true, speed: 1, opacity_min: 0.3, sync: false } },
        size: { value: 3, random: true, anim: { enable: true, speed: 2, size_min: 0.5, sync: false } },
        line_linked: { enable: true, distance: 150, color: "#6C63FF", opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out", bounce: false }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true },
        modes: { grab: { distance: 200, line_linked: { opacity: 0.6 } }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
